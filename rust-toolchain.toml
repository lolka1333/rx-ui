# Pinned Rust toolchain. Matches `rust-version` in the workspace Cargo.toml.
# Without this, `rustup`/`cargo` use whatever the user's default is — fine
# on the maintainer's box, breaks on a fresh checkout or CI runner that
# happens to default to an older toolchain.
#
# The floor is 1.85: the `2024` edition + `std::env::set_var` inside
# `build.rs` (gated behind `#[allow(unsafe_code)]`) both require it. The pin
# tracks the current stable rather than the floor, so CI, the Docker build and
# a fresh checkout all lint with the same clippy.

[toolchain]
channel = "1.100"
profile = "minimal"
components = ["rustfmt", "clippy"]
